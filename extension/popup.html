<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  body{width:300px;margin:0;padding:14px;font:14px/1.5 -apple-system,'Segoe UI',sans-serif;
    background:#F7F3EC;color:#17140F}
  h1{font-size:1rem;margin:0 0 2px}
  .sub{font-size:.8rem;color:#5A5348;margin-bottom:12px}
  .row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  button{background:#B98A2F;color:#fff;border:0;border-radius:10px;padding:9px 14px;
    font:inherit;font-weight:600;cursor:pointer;flex:1}
  button.ghost{background:transparent;color:#B98A2F;border:1px solid #B98A2F}
  button:disabled{opacity:.5;cursor:default}
  .pill{font-size:.72rem;font-weight:600;border-radius:100px;padding:2px 9px;
    background:rgba(185,138,47,.15);color:#7A5A1B}
  .pill.on{background:rgba(31,175,90,.15);color:#157A3F}
  .logs{margin-top:10px;max-height:160px;overflow:auto;font-size:.76rem;color:#5A5348;
    border-top:1px solid rgba(23,20,15,.1);padding-top:8px}
  .logs div{padding:2px 0}
  .warn{background:rgba(192,57,43,.08);color:#8A2C22;border-radius:8px;padding:8px;
    font-size:.76rem;margin-bottom:10px}
</style>
</head>
<body>
  <h1>Forly — פרסום לקבוצות</h1>
  <div class="sub" id="sub">לא מחובר</div>

  <div class="warn" id="modeWarn" hidden>
    מצב אוטומטי פעיל. מומלץ מצב "אישור ידני" — הוא בטוח יותר לחשבון.
  </div>

  <div class="row">
    <span class="pill" id="modePill">אישור ידני</span>
    <span class="pill" id="capPill"></span>
  </div>

  <div class="row">
    <button id="start">התחלה</button>
    <button id="stop" class="ghost">עצירה</button>
  </div>
  <div class="row">
    <button id="sync" class="ghost">סנכרון הקבוצות שלי</button>
  </div>

  <div class="sub" id="hint">פותחים את עמוד ההפצה ב-Forly ובוחרים נכס כדי להתחיל.</div>

  <!-- Fallback pairing: production hands the token over automatically, but a
       tunnel/dev domain isn't in externally_connectable, so allow a paste. -->
  <details id="manual" style="margin-top:8px">
    <summary style="font-size:.78rem;cursor:pointer;color:#5A5348">חיבור ידני (למפתחים)</summary>
    <div class="row" style="margin-top:8px">
      <input id="tokenIn" placeholder="קוד חיבור מ-Forly"
        style="flex:1;min-width:0;border:1px solid rgba(23,20,15,.15);border-radius:10px;padding:8px;font:inherit">
    </div>
    <div class="row">
      <input id="baseIn" placeholder="https://…"
        style="flex:1;min-width:0;border:1px solid rgba(23,20,15,.15);border-radius:10px;padding:8px;font:inherit;direction:ltr">
      <button id="pairBtn" class="ghost" style="flex:0 0 auto">חיבור</button>
    </div>
  </details>

  <div class="logs" id="logs"></div>

<script src="popup.js"></script>
</body>
</html>
