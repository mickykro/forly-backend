<!doctype html>
<!--
  dev-driver.html — dev-only: the live Driver browsers this server has open.
  Served only with DRIVER_DEV_VIEW=1 (security.js 404s it otherwise); the API
  behind it exists only under FORLY_ENV=local. No iframe: "watch" asks for a
  single-use viewer grant (needs an OTP login in the last 10 minutes) and
  opens it in a new tab, where the server redirects to the Driver viewer.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Driver sessions (dev)</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; color: #1a1a1a; background: #fafafa; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  #status { color: #666; margin-bottom: 12px; min-height: 1.4em; }
  #status.err { color: #b00020; }
  table { border-collapse: collapse; width: 100%; max-width: 900px; background: #fff; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e5e5e5; }
  th { font-weight: 600; color: #444; }
  button { font: inherit; padding: 4px 10px; cursor: pointer; }
  .empty { color: #888; padding: 12px 8px; }
</style>
</head>
<body>
<h1>Driver sessions (dev)</h1>
<div id="status">Loading…</div>
<table>
  <thead><tr><th>Note</th><th>Platform</th><th>Started</th><th></th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<script>
(function () {
  var rows = document.getElementById("rows");
  var statusEl = document.getElementById("status");

  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.className = isErr ? "err" : "";
  }

  function cell(tr, text) {
    var td = document.createElement("td");
    td.textContent = text == null ? "—" : String(text);
    tr.appendChild(td);
    return td;
  }

  function watch(sessionId, btn) {
    btn.disabled = true;
    fetch("/api/dev/driver/sessions/" + encodeURIComponent(sessionId) + "/grant", { method: "POST", credentials: "same-origin" })
      .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
      .then(function (res) {
        if (res.status === 401 && res.body.error === "stepup_required") {
          setStatus("Step-up required: log in again with an OTP (valid 10 minutes), then retry.", true);
        } else if (res.status !== 200) {
          setStatus("Could not get a viewer grant (" + (res.body.error || res.status) + ").", true);
        } else {
          window.open(res.body.open_url, "_blank", "noopener");
        }
      })
      .catch(function () { setStatus("Network error while requesting a grant.", true); })
      .then(function () { btn.disabled = false; });
  }

  function render(sessions) {
    rows.textContent = "";
    if (!sessions.length) {
      var tr = document.createElement("tr");
      var td = cell(tr, "No live sessions.");
      td.colSpan = 4; td.className = "empty";
      rows.appendChild(tr);
      return;
    }
    sessions.forEach(function (s) {
      var tr = document.createElement("tr");
      cell(tr, s.note);
      cell(tr, s.platform);
      cell(tr, s.startedAt ? new Date(s.startedAt).toLocaleString() : null);
      var td = document.createElement("td");
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "Watch";
      btn.disabled = !s.viewer_available;
      btn.addEventListener("click", function () { watch(s.sessionId, btn); });
      td.appendChild(btn);
      tr.appendChild(td);
      rows.appendChild(tr);
    });
  }

  function poll() {
    fetch("/api/dev/driver/sessions", { credentials: "same-origin", cache: "no-store" })
      .then(function (r) {
        if (r.status === 401) throw new Error("Not logged in.");
        if (r.status === 403) throw new Error("Not an admin.");
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (b) {
        render(b.sessions || []);
        setStatus("Updated " + new Date().toLocaleTimeString() + " · refreshes every 5 s", false);
      })
      .catch(function (e) { setStatus(e.message, true); });
  }

  poll();
  setInterval(poll, 5000);
})();
</script>
</body>
</html>
