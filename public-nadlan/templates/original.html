/* Scroll puzzle: matching wave profiles share the same 80px coordinate band. */

.hero,.facts-section,.living,.detail-section,.film-section,.contact{clip-path:none;margin-top:0}
.hero{z-index:12;background:var(--paper);will-change:transform}
.facts-section{z-index:2;padding-top:120px;padding-bottom:90px}

[hidden]{display:none!important}body{font-family:var(--sans,Discovery,Arial,sans-serif)}h1,h2,h3{font-family:var(--disp,Discovery,Arial,sans-serif)}.brand{max-width:220px;letter-spacing:0;font-size:24px}.brand img{max-height:48px;max-width:180px;object-fit:contain}.hero-facts{grid-template-columns:repeat(auto-fit,minmax(65px,1fr))}.gallery-composition{grid-template-columns:1.15fr .85fr}.classic-tile{min-width:0}.classic-tile .photo-button{height:480px;border-radius:85px 12px 12px 12px;overflow:hidden}.classic-tile:nth-child(even){padding-top:90px}.classic-tile:nth-child(even) .photo-button{border-radius:12px 12px 85px 12px;height:380px}.classic-tile .photo-caption{direction:rtl}.detail-grid ul{padding-inline-start:20px;margin-top:25px}.detail-grid li{margin-bottom:10px}.hero.no-media{grid-template-columns:1fr;min-height:0}.hero.no-media .hero-copy{padding-bottom:40px}.story-glimpse.no-photo{grid-template-columns:1fr auto}.hero-video-pause{position:absolute;z-index:3;bottom:16px;left:16px;min-width:44px;min-height:44px;background:var(--paper);color:var(--night);border:1px solid var(--line)}@media(max-width:700px){.classic-tile .photo-button{height:440px}.classic-tile:nth-child(even){padding-top:0;padding-inline-start:25px}.classic-tile:nth-child(even) .photo-button{height:350px}.gallery-composition{grid-template-columns:1fr}.brand{max-width:155px;font-size:20px}.brand img{max-width:140px}.contact .lead-form{padding:22px}}.contact{background:linear-gradient(155deg,var(--night) 0%,#2c3830 55%,var(--night) 100%);color:var(--paper)}
.contact .lead-form{color:var(--ink)}
.contact .agent{background:#f0ede4e6;color:var(--night);padding:14px 18px;border-radius:0 24px 0 24px;display:inline-flex;width:auto}
.contact .agent small{color:#4b564d}.contact .agent-mark{color:var(--night);border-color:#8a9384}
.contact .contact-bottom{color:var(--paper);border-color:#b9c0b455}
</style></head><body>
<header><a class="brand" href="#top" data-logo><span data-bind="agent.brand_name||agent.name"></span></a><nav class="nav"><a href="#gallery" data-i18n="gallery">גלריה</a><a href="#details" data-i18n="the_property">פרטי הנכס</a></nav><a class="header-action" href="#contact"><span data-i18n="book_visit">תיאום ביקור</span><span class="square" aria-hidden="true">↙</span></a></header>
<main id="top">
<section class="hero" aria-labelledby="hero-title"><div class="hero-copy"><div class="eyebrow"><span data-bind="property.neighborhood||property.city"></span><span data-deal></span></div><h1 id="hero-title" data-bind="hero.phrase||property.title"></h1><p data-bind="property.title||property.address"></p><div class="hero-meta" data-show="property.price"><strong class="num" data-bind="property.price" data-fmt="price"></strong><small data-price-label></small></div><dl class="hero-facts"><div data-show="property.size_sqm"><dt data-i18n="built_area">שטח בנוי</dt><dd class="num" data-bind="property.size_sqm"></dd></div><div data-show="property.rooms"><dt data-i18n="rooms">חדרים</dt><dd class="num" data-bind="property.rooms"></dd></div><div data-floor><dt data-i18n="floor">קומה</dt><dd class="num" data-bind="property.floor"></dd></div><div data-show="property.parking"><dt data-i18n="parking">חניות</dt><dd class="num" data-bind="property.parking"></dd></div></dl><div class="hero-actions"><a class="action" href="#contact"><span data-i18n="book_visit">תיאום ביקור</span><span class="arrow" aria-hidden="true">↙</span></a><a class="quiet-link" href="#gallery" data-i18n="view_gallery">צפו בגלריה</a></div></div><figure class="hero-image"><div class="image-cut"><video class="hero-video" data-video autoplay muted loop playsinline preload="metadata"></video></div></figure></section>
<section class="facts-section"><div class="story-glimpse"><figure><img class="glimpse-photo" alt="" loading="lazy"></figure><div><p data-bind="texts.why_sub||carousel.slides.0.title||property.title"></p><span data-bind="carousel.slides.0.body||hero.phrase"></span></div><span class="glimpse-arrow" aria-hidden="true">↙</span></div></section>
<section class="living" id="gallery"><div class="living-head"><p class="muted" data-bind="texts.gallery_sub"></p></div><div class="gallery-composition" id="classic-gallery"></div></section>
<section class="detail-section" id="details"><div class="detail-grid"><div><p data-bind="area.blurb||texts.area_sub||hero.phrase"></p><div data-amenities></div><ul data-list="area.stops"><template><li><b data-field="label"></b> <span data-field="minutes"></span></li></template></ul></div><div><dl class="spec-table"><div data-show="property.address"><dt data-i18n="the_address">כתובת</dt><dd data-bind="property.address"></dd></div><div data-show="property.neighborhood"><dt data-i18n="the_area">שכונה</dt><dd data-bind="property.neighborhood"></dd></div><div data-show="property.price"><dt data-price-label></dt><dd class="num" data-bind="property.price" data-fmt="price"></dd></div><div data-show="property.size_sqm"><dt data-i18n="built_area">שטח בנוי</dt><dd class="num" data-bind="property.size_sqm"></dd></div><div data-show="property.rooms"><dt data-i18n="rooms">חדרים</dt><dd data-bind="property.rooms"></dd></div><div data-floor><dt data-i18n="floor">קומה</dt><dd data-bind="property.floor"></dd></div><div data-show="property.parking"><dt data-i18n="parking">חניות</dt><dd data-bind="property.parking"></dd></div></dl></div></div></section>
<section class="film-section" id="film"><div class="film-stage"><div class="video-wrap"><video id="tour" controls playsinline preload="none"></video></div><div class="film-aside"><p data-bind="carousel.slides.1.body||hero.phrase||property.title"></p><button id="play-tour" data-i18n="video_tour">צפו בסיור</button></div></div></section>
<section class="contact" id="contact"><div class="contact-grid"><div><p data-bind="cta.headline" data-i18n="book_visit">תיאום ביקור</p><p data-bind="cta.sub"></p><div class="agent"><span class="agent-mark" data-avatar></span><div><span data-bind="agent.name"></span><small data-bind="agent.brand_name"></small><small data-show="agent2.name" data-bind="agent2.name"></small></div></div></div><div><form class="lead-form" data-lead-form><label for="name"><span data-i18n="form_name">שם מלא</span><input id="name" name="name" data-lead="name" autocomplete="name" required></label><label for="phone"><span data-i18n="form_phone">טלפון</span><input id="phone" name="phone" data-lead="phone" type="tel" autocomplete="tel" inputmode="tel" required></label><button class="action" type="submit"><span data-i18n="book_visit" data-bind="cta.button_label">תיאום ביקור</span><span class="arrow" aria-hidden="true">↙</span></button></form><p id="classic-lead-sent" role="status" hidden data-i18n="sent_title">הפרטים אצלנו.</p></div></div><div class="contact-bottom"><span data-bind="property.address||property.title"></span><span data-bind="property.city"></span></div></section></main>
<footer><span class="brand">forly.</span><a href="#contact" data-i18n="book_visit">תיאום ביקור</a></footer>
<dialog aria-label="Gallery"><button class="gallery-close" autofocus aria-label="Close gallery">סגירה</button><button class="gallery-prev" aria-label="Previous image" data-i18n-aria="nav_prev">❮</button><img alt=""><button class="gallery-next" aria-label="Next image" data-i18n-aria="nav_next">❯</button><div class="gallery-count" aria-live="polite" dir="ltr"></div></dialog>
<script src="/tpl/i18n.js"></script><script src="/tpl/demo.js"></script><script src="/tpl/runtime.js"></script><script src="/tpl/original.js"></script></body></html>
